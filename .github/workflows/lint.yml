name: lint-free
on: [push, pull_request]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # repeat same job for each subsystem in the following subdirectories
        subdir: [web-app, machine-learning-client]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # update version(s) as needed
      - name: Install dependencies
        if: ${{ matrix.subdir == 'web-app' && hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: |
          cd ${{ matrix.subdir }}
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv sync --dev --python $(which python)
          pipenv shell --fancy --python $(which python)
      - name: Lint with pylint
        if: ${{ matrix.subdir == 'web-app' && hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        # you may set pylint to ignore any files or dependencies that make no sense to lint
        run: |
          cd ${{ matrix.subdir }}
          pipenv run pylint $(git ls-files '*.py')
      - name: Format with black
        if: ${{ matrix.subdir == 'web-app' && hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        # you may set black to ignore any files or dependencies that make no sense to format
        run: |
          cd ${{ matrix.subdir }}
          pipenv run black --diff --check .
      - name: Install ml client system libraries
        if: ${{ matrix.subdir == 'machine-learning-client' }}
        run: sudo apt-get update && sudo apt-get install -y libxcb1 libgl1 libglib2.0-0
      - name: Install ml client dependencies
        if: ${{ matrix.subdir == 'machine-learning-client' }}
        working-directory: machine-learning-client
        run: python -m pip install -r requirements.txt
      - name: Lint ml client with pylint
        if: ${{ matrix.subdir == 'machine-learning-client' }}
        working-directory: machine-learning-client
        run: pylint model.py server.py tests/*.py
      - name: Format ml client with black
        if: ${{ matrix.subdir == 'machine-learning-client' }}
        working-directory: machine-learning-client
        run: black --diff --check .
